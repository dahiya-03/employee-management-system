{% extends 'base.html' %}

{% block title %}Remove an Employee{% endblock %}

{% block content %} 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove an Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-1 text-dark fw-bold">Remove an Employee</h1>
                        <p class="text-muted mb-4">Select an employee from the dropdown list to remove them.</p>

                        <div class="dropdown w-100">
                            <button class="btn btn-outline-danger dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center py-2 px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span>Choose the Employee to be removed</span>
                            </button>
                            <ul class="dropdown-menu w-100 shadow-sm border-0 mt-1">
                                {% for i in emp_details %}
                                <li><a class="dropdown-item py-2" href="/remove_emp/{{i.id}}">{{i.first_name}} {{i.last_name}}</a></li>
                                {% endfor %}
                            </ul>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html> -->

{% endblock %}
