{% extends 'base.html' %}

{% block title %}Add an Employee{% endblock %}

{% block content %} 


    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-1 text-dark fw-bold">Add An Employee</h1>
                        <p class="text-muted mb-4">Please fill out the details below to register a new employee.</p>

                        
                        <form action="/add_emp" method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="first_name" class="form-label fw-medium text-secondary">First Name</label>
                                <input type="text" id="first_name" name="first_name" value="{{first_name}}" class="form-control py-2" required>
                            </div>

                            <div class="mb-3">
                                <label for="last_name" class="form-label fw-medium text-secondary">Last Name</label>
                                <input type="text" id="last_name" name="last_name" value="{{last_name}}" class="form-control py-2" required>
                            </div>

                            <div class="mb-3">
                                <label for="salary" class="form-label fw-medium text-secondary">Salary</label>
                                <input type="number" id="salary" name="salary" value="{{salary}}" class="form-control py-2" required>
                            </div>

                            <div class="mb-3">
                                <label for="dept" class="form-label fw-medium text-secondary">Department</label>
                                <select id="dept" name="dept" class="form-select py-2" required>
                                    <option value="" disabled selected>Select Department</option>
                                    {% for d in departments %}
                                        <option value="{{ d.id }}">{{ d.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                           <div class="mb-3">
                                <label for="role" class="form-label fw-medium text-secondary">Role</label>
                                <select id="role" name="role" class="form-select py-2" required>
                                    <option value="" disabled selected>Select Role</option>
                                    {% for r in roles %}
                                        <option value="{{ r.id }}">{{ r.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="bonus" class="form-label fw-medium text-secondary">Bonus</label>
                                <input type="number" id="bonus" name="bonus" value="{{bonus}}" class="form-control py-2">
                            </div>

                            <div class="mb-4">
                                <label for="phone" class="form-label fw-medium text-secondary">Phone Number</label>
                                <input type="number" id="phone" name="phone" value="{{phone}}" class="form-control py-2" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success py-2 fw-semibold">Submit Employee</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

   

{% endblock %}
