{% block title %}Filter The Employee{% endblock %}

{% block content %}

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-1 text-dark fw-bold">Find the Employee</h1>
                        <p class="text-muted mb-4">Search for employees using their name, department, or role.</p>

                        
                        <form action="/filter_emp" method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="name" class="form-label fw-medium text-secondary">Employee First / Last Name</label>
                                <input type="text" id="name" name="name" value="{{name}}" class="form-control py-2">
                            </div>

                            <div class="mb-3">
                                <label for="dept" class="form-label fw-medium text-secondary">Department</label>
                                <input type="text" id="dept" name="dept" value="{{dept}}" class="form-control py-2">
                            </div>

                            <div class="mb-4">
                                <label for="role" class="form-label fw-medium text-secondary">Role</label>
                                <input type="text" id="role" name="role" value="{{role}}" class="form-control py-2">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 fw-semibold">Search Employee</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

{% endblock %}
